<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>
  /* Paleta do card: cabeçalho preto com a marca; corpo branco suave com texto grafite. */
  :root { --black:#000000; --page:#F7F8FA; --head-sub:#D7E1ED; --ink:#202833; --navy:#142D4E;
    --teal:#236779; --muted:#626B78; --line:#DCE1E7; --red:#C93436; --white:#FFFFFF; }
  @page { size: 120mm 480mm; margin: 0; }  /* trocado pela altura do conteúdo (FIT_PAGE) */
  html { width: 120mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink);
    font: 20px/1.4 "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  a { color: inherit; text-decoration: none; }
  .top { padding: 0 0 16px; background: var(--black); border-bottom: 5px solid var(--red); }
  .top img { display: block; width: 100%; }
  .date { margin: 2px 16px 0; font-size: 18px; color: var(--head-sub); }
  .date b { color: var(--white); font-weight: 700; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 16px 4px; }
  nav a { font-size: 15px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
    background: var(--white); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--navy); }
  section { padding: 22px 16px 6px; break-inside: auto; }
  h2 { margin: 0 0 4px; display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800;
    letter-spacing: .1em; text-transform: uppercase; color: var(--navy); break-after: avoid; }
  h2::after { content: ""; flex: 1; height: 2px; background: var(--red); }
  h2 .n { color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  ol { list-style: none; margin: 0; padding: 0; counter-reset: item; }
  li { counter-increment: item; display: grid; grid-template-columns: 34px 1fr; gap: 0 4px;
    padding: 14px 0; border-bottom: 1px solid var(--line); break-inside: avoid; }
  li:last-child { border-bottom: 0; }
  li::before { content: counter(item, decimal-leading-zero); font-size: 17px; font-weight: 800;
    color: var(--muted); padding-top: 1px; }
  .src { display: block; font-size: 16px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
    color: var(--teal); margin-bottom: 3px; }
  .src span { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; }
  .hl { font-size: 21px; font-weight: 600; line-height: 1.32; color: var(--ink); }
  .hl::after { content: " ↗"; color: var(--teal); font-weight: 700; }
  .listen { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 16px 16px 0;
    padding: 14px; border-radius: 14px; background: var(--red); color: var(--white); font-size: 20px; font-weight: 800;
    letter-spacing: .06em; text-transform: uppercase; }
  .listen small { font-size: 16px; font-weight: 600; opacity: .9; letter-spacing: 0; text-transform: none; }
  h2::after { order: 1; }
  .play { order: 2; flex: none; font-size: 14px; font-weight: 700; letter-spacing: .04em; color: var(--red);
    background: var(--white); border: 1.5px solid var(--red); border-radius: 999px; padding: 4px 10px; text-transform: uppercase; }
  .play small { color: var(--muted); font-weight: 600; text-transform: none; }
  footer { padding: 20px 16px; border-top: 5px solid var(--red); margin-top: 14px; font-size: 16px; color: var(--muted); }
  footer b { color: var(--navy); }
  .more { margin: 6px 16px 18px; padding: 14px; border-radius: 14px; background: var(--black); color: var(--white);
    font-size: 19px; font-weight: 700; text-align: center; }
  .more small { display: block; margin-top: 2px; font-size: 15px; font-weight: 500; color: var(--head-sub); }

  html { width: auto; }  /* a imagem ocupa a largura toda (no PDF a página tem 120 mm) */
  .top { padding-bottom: 20px; }
  .date { font-size: 20px; }
  .upd { display: inline-block; margin: 14px 16px 0; padding: 6px 14px; border-radius: 999px; background: var(--red);
    color: var(--white); font-size: 17px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
</style></head>
